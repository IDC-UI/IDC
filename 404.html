<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>IDC — جاري التوجيه…</title>
<script>
(function () {
  var path = location.pathname || "/";
  // Extract segment after /IDC/ or root /<route_id>
  var match = path.match(/\/IDC\/([A-Za-z0-9_-]{3,24})\/?$/i) || path.match(/^\/([A-Za-z0-9_-]{3,24})\/?$/i);
  var base = path.toLowerCase().indexOf("/idc/") === 0 ? "/IDC/" : "/";
  if (match && match[1] && match[1].toLowerCase() !== "index.html") {
    var routeId = match[1];
    try { sessionStorage.setItem("idc_requested_route", routeId); } catch (e) {}
    location.replace(base + "?route=" + encodeURIComponent(routeId) + location.hash);
  } else {
    location.replace(base);
  }
})();
</script>
</head>
<body style="background:#0f1426;color:#e9edf9;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0">
<div>IDC · جاري التحقق من الصلاحيات…</div>
</body>
</html>
