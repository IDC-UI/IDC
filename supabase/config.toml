project_id = "idc"

# Applied with `supabase config push`. Set the real GitHub Pages URL first.
[auth]
enabled = true
# site_url = "https://YOUR_USER.github.io/IDC/"
# additional_redirect_urls = ["https://YOUR_USER.github.io/IDC/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

# Server-side brute-force protection for sign-in / sign-up (per IP, per 5 minutes).
[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
anonymous_users = 5

# Enable once you create a Cloudflare Turnstile site (secret goes in the environment, never in this file):
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET)"

[functions.secure-upload]
verify_jwt = true

[functions.secure-vault]
verify_jwt = true
